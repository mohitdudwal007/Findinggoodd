<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Google Gemini Gradient Duo -->
    <linearGradient id="gemini-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="35%" stop-color="#9B72F3" />
      <stop offset="70%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#FBBC05" />
    </linearGradient>

    <!-- Deep Blue Cyber Sparkle Glow -->
    <filter id="cyber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Google Cloud Style Rounded Hexagonal Shield Background -->
  <rect width="512" height="512" rx="145" fill="#07080d" stroke="url(#gemini-grad)" stroke-width="5" />

  <!-- Outer Interstellar Cyber Orbit Rings (Symmetric Cinema Lens) -->
  <circle cx="256" cy="256" r="205" fill="none" stroke="rgba(155, 114, 243, 0.08)" stroke-width="16" />
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#gemini-grad)" stroke-width="6" stroke-dasharray="12 18" opacity="0.85" filter="url(#cyber-glow)" />

  <!-- Central Multi-Point Gemini Spark & Play Button Fusion -->
  <g transform="translate(141, 141)">
    <!-- Gorgeous 4-point Spark representation -->
    <path d="M 115 15 C 115 15 125 80 160 95 C 195 110 215 110 215 110 C 215 110 195 110 160 125 C 125 140 115 205 115 205 C 115 205 105 140 70 125 C 35 110 15 110 15 110 C 15 110 35 110 70 95 C 105 80 115 15 115 15 Z" fill="url(#gemini-grad)" filter="url(#cyber-glow)" />
    
    <!-- Central Pure White Play Emblem indicating Movie Streams -->
    <path d="M 103 94 L 103 126 L 129 110 Z" fill="#ffffff" />
  </g>
</svg>
