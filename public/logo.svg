<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="50%" stop-color="#FFA751" />
      <stop offset="100%" stop-color="#FF512F" />
    </linearGradient>
    
    <!-- Outer Rim Glow -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Velvet Slate Background -->
  <rect width="512" height="512" rx="140" fill="#0c0c0e" stroke="url(#gold-grad)" stroke-width="6" />

  <!-- Film Reel Inner Core -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,215,0,0.08)" stroke-width="24" />
  
  <!-- Outer Film Reel Dots -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#gold-grad)" stroke-width="10" stroke-dasharray="24 16" filter="url(#gold-glow)" />

  <!-- Center Master Emblem (F & Play Fusion) -->
  <g transform="translate(120, 115)">
    <!-- Stylized F that fuses a flag and modern search curve -->
    <path d="M 60,30 L 60,250 C 60,255 65,260 70,260 L 80,260 C 85,260 90,255 90,250 L 90,160 L 170,160 C 178,160 185,152 185,142 C 185,132 178,124 170,124 L 90,124 L 90,86 L 200,86 C 208,86 215,78 215,68 C 215,58 208,50 200,50 L 90,50 L 90,30 C 90,20 82,12 72,12 C 62,12 60,18 60,30 Z" fill="url(#gold-grad)" />
    
    <!-- Dynamic Cinema Search Arch / Viewing Lens -->
    <path d="M 120,20 C 195,20 250,75 250,150 C 250,225 185,270 120,270" fill="none" stroke="url(#gold-grad)" stroke-width="16" stroke-linecap="round" opacity="0.85" />
    
    <!-- Central White Play Icon for Stream/Download identification -->
    <path d="M 125,108 L 125,140 L 150,124 Z" fill="#ffffff" />
  </g>
</svg>
